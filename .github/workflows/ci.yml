name: CI

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    plugin:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 20

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.34.5

            - name: Install plugin deps
              run: pnpm install --frozen-lockfile
              working-directory: plugin

            - name: Lint plugin
              run: pnpm lint:check
              working-directory: plugin

            - name: Build plugin
              run: pnpm build
              working-directory: plugin

    server:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup uv
              uses: astral-sh/setup-uv@v8.3.2

            - name: Run server tests
              run: |
                  UV_LOCK_INDEX="$(awk -F '"' '/^source = \{ registry = / { print $2; exit }' uv.lock)"
                  test -n "$UV_LOCK_INDEX"
                  UV_DEFAULT_INDEX="$UV_LOCK_INDEX" uv run --locked python -m unittest discover -s tests
              working-directory: server

            - name: Validate PyPI artifacts
              run: |
                  VERSION="$(python -c 'import tomllib; print(tomllib.load(open("server/pyproject.toml", "rb"))["project"]["version"])')"
                  uv build server --out-dir server/dist --clear --no-sources
                  python scripts/check_pypi_artifacts.py server/dist "$VERSION"
