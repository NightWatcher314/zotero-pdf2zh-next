name: Publish PyPI

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to build and publish
                required: true
                type: string

concurrency:
    group: publish-pypi-${{ inputs.tag }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout tag
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.tag }}

            - name: Setup uv
              uses: astral-sh/setup-uv@v8.3.2

            - name: Verify tag and versions
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
                  test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
                  python - "$RELEASE_TAG" <<'PY'
                  import json
                  import re
                  import sys
                  import tomllib
                  from pathlib import Path

                  version = sys.argv[1].removeprefix("v")
                  plugin = json.loads(Path("plugin/package.json").read_text())["version"]
                  server = tomllib.loads(Path("server/pyproject.toml").read_text())["project"]["version"]
                  match = re.search(r'^VERSION = "([^"]+)"$', Path("server/server.py").read_text(), re.MULTILINE)
                  runtime = match.group(1) if match else None
                  if {plugin, server, runtime} != {version}:
                      raise SystemExit(
                          f"version mismatch: tag={version}, plugin={plugin}, server={server}, runtime={runtime}"
                      )
                  PY

            - name: Build package
              run: uv build server --out-dir server/dist --clear --no-sources

            - name: Validate package
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: python scripts/check_pypi_artifacts.py server/dist "${RELEASE_TAG#v}"

            - name: Publish package
              run: >-
                  uv publish
                  --trusted-publishing always
                  --check-url https://pypi.org/simple/zotero-pdf2zh-next/
                  server/dist/*
