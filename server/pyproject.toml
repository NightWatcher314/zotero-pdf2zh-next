[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-pdf2zh-next"
version = "5.2.8"
description = "Minimal pdf2zh_next bridge for the Zotero plugin"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flask>=3.1.0,<4",
    "pdf2zh_next>=2.8.2",
    "pypdf>=6.0.0,<7",
    "tomlkit>=0.13.0,<1",
]

[tool.uv]
exclude-dependencies = [
    { package = { name = "pdf2zh-next", version = "2.8.2" }, dependencies = [
        "chardet",
        "fastapi",
        "gradio",
        "gradio-i18n",
        "gradio-pdf",
        "legacy-cgi",
        "pydantic-settings",
        "pyyaml",
        "sse-starlette",
        "uvicorn",
    ] },
    { package = { name = "rapidocr-onnxruntime", version = "1.4.4" }, dependencies = [
        "opencv-python",
    ] },
]

[project.scripts]
zotero-pdf2zh-next = "server:main"

[tool.setuptools]
py-modules = ["server", "task_manager", "pdf2zh_next_service"]
